<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PDDR Greenfield Exampleの実行可能サンプル。Pocket Gardenで小さな竹を育てます。">
  <title>Pocket Garden — Bamboo Plot</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">PDDR Greenfield Example</p>
      <h1>Pocket Garden <span aria-hidden="true">🎋</span></h1>
      <p class="lead">PDDRを説明するために、なぜか竹を育てます。</p>
    </header>

    <section class="garden-card" aria-labelledby="garden-title">
      <div class="garden-sky" aria-hidden="true"></div>
      <div class="garden-ground">
        <div id="bamboo-visual" class="bamboo-visual" role="img" aria-label="植えたばかりの竹の子">🌱</div>
      </div>

      <div class="garden-content">
        <div>
          <p class="status-label">いまの竹</p>
          <h2 id="garden-title">竹の子</h2>
          <p id="garden-message" class="garden-message" aria-live="polite">竹の子を植えました。まずは水をあげてみましょう。</p>
        </div>

        <dl class="stats">
          <div>
            <dt>水やり</dt>
            <dd><span id="water-count">0</span> 回</dd>
          </div>
          <div>
            <dt>保存先</dt>
            <dd>このブラウザ</dd>
          </div>
        </dl>

        <div class="actions">
          <button id="water-button" class="primary-button" type="button">💧 水をやる</button>
          <button id="reset-button" class="secondary-button" type="button">植え直す</button>
        </div>
      </div>
    </section>

    <section class="note" aria-labelledby="why-title">
      <h2 id="why-title">これは何？</h2>
      <p>
        竹を育てること自体が目的ではなく、小さな実装を実際に触りながら
        「何を決めたか・なぜ決めたか・どう検証したか」をPDDRで辿るためのfixtureです。
      </p>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
